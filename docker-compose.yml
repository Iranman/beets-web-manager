# Production Docker Compose file for Beets Web Manager stack.
# Deploys both Beets and Beets Web Manager using published images.
#
# Usage:
#   docker compose up -d

services:
  beets:
    image: lscr.io/linuxserver/beets:2.13.1
    container_name: beets
    restart: unless-stopped
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
    volumes:
      - ${BEETS_CONFIG_PATH:-./beets}:/config
      - ${MUSIC_PATH:-./music}:/music
      - ${DOWNLOADS_PATH:-./downloads}:/downloads

  beets-web-manager:
    image: ghcr.io/iranman/beets-web-manager:stable
    container_name: beets-web-manager
    restart: unless-stopped
    ports:
      - "${WEBCONTROL_PORT:-8337}:8337"
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
      WEBCONTROL_PORT: 8337

      # All of the following are optional -- .env.example documents them,
      # and every one is blank/inert by default. None is required to reach
      # the browser setup wizard.
      BEETS_WEB_USERNAME: ${BEETS_WEB_USERNAME:-}
      BEETS_WEB_PASSWORD: ${BEETS_WEB_PASSWORD:-}
      BEETS_WEB_AUTH_TOKEN: ${BEETS_WEB_AUTH_TOKEN:-}
      BEETS_WEB_AUTH_DISABLED: ${BEETS_WEB_AUTH_DISABLED:-0}
      BEETS_TRUSTED_PROXIES: ${BEETS_TRUSTED_PROXIES:-}

      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-}

      ACOUSTID_API_KEY: ${ACOUSTID_API_KEY:-}
      DISCOGS_TOKEN: ${DISCOGS_TOKEN:-}
      LISTENBRAINZ_TOKEN: ${LISTENBRAINZ_TOKEN:-}

      PLEX_URL: ${PLEX_URL:-}
      PLEX_TOKEN: ${PLEX_TOKEN:-}
      LIDARR_URL: ${LIDARR_URL:-}
      LIDARR_API_KEY: ${LIDARR_API_KEY:-}

      SLSKD_URL: ${SLSKD_URL:-}
      SLSKD_API_KEY: ${SLSKD_API_KEY:-}

      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}

      DEMO_MODE: ${DEMO_MODE:-0}
    volumes:
      - ${BEETS_CONFIG_PATH:-./beets}:/config
      - ${MUSIC_PATH:-./music}:/music
      - ${DOWNLOADS_PATH:-./downloads}:/downloads
      - ${WEB_MANAGER_DATA_PATH:-./web-manager}:/data
    depends_on:
      - beets
