services:
  beets:
    build:
      context: .
      dockerfile: Dockerfile.beets
    image: beets-engine:2.4.0
    container_name: beets
    restart: unless-stopped
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-America/Los_Angeles}
      - BEETSDIR=/config
      - BEETS_API_TOKEN=${BEETS_API_TOKEN:?set a required strong token}
      - BEETS_AGENT_PORT=8338
    volumes:
      - ./config:/config
      - ${MUSIC_LIBRARY_PATH:-./data/music}:/data/media/music
      - ${DOWNLOAD_PATH:-./data/downloads}:/data/torrents
    expose:
      - "8338"
    healthcheck:
      test: ["CMD", "/lsiopy/bin/python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8338/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 3

  beets-web-manager:
    build: .
    image: beets-web-manager:0.1.0
    container_name: beets-web-manager
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEBCONTROL_PORT:-8337}:8337"
    environment:
      - BEETS_API_URL=http://beets:8338
      - BEETS_API_TOKEN=${BEETS_API_TOKEN:?set a required strong token}
      - BEETS_WEB_AUTH_TOKEN=${BEETS_WEB_AUTH_TOKEN:?set a strong owner token}
      - BEETS_WEB_PASSWORD=${BEETS_WEB_PASSWORD:-}
      - BEETS_WEB_USERNAME=${BEETS_WEB_USERNAME:-admin}
      - BEETS_WEB_AUTH_DISABLED=${BEETS_WEB_AUTH_DISABLED:-0}
      - BEETS_TRUSTED_PROXIES=${BEETS_TRUSTED_PROXIES:-}
      - BEETS_OUTBOUND_ALLOWLIST=${BEETS_OUTBOUND_ALLOWLIST:-}
      - WEBCONTROL_PORT=${WEBCONTROL_PORT:-8337}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_BASE_URL=${AI_BASE_URL:-}
      - AI_MODEL=${AI_MODEL:-}
      - ACOUSTID_API_KEY=${ACOUSTID_API_KEY:-}
      - ACOUSTID_KEY=${ACOUSTID_KEY:-}
      - PLEX_URL=${PLEX_URL:-}
      - PLEX_TOKEN=${PLEX_TOKEN:-}
      - LIDARR_URL=${LIDARR_URL:-}
      - LIDARR_API_KEY=${LIDARR_API_KEY:-}
      - DISCOGS_TOKEN=${DISCOGS_TOKEN:-}
      - DISCOGS_USER_TOKEN=${DISCOGS_USER_TOKEN:-}
      - LISTENBRAINZ_TOKEN=${LISTENBRAINZ_TOKEN:-}
      - SLSKD_URL=${SLSKD_URL:-}
      - SLSKD_API_KEY=${SLSKD_API_KEY:-}
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID:-}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET:-}
      - YTDLP_PO_PROVIDER_URL=${YTDLP_PO_PROVIDER_URL:-}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - DEMO_MODE=${DEMO_MODE:-0}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=512m
      - /run:rw,nosuid,nodev,size=64m
    volumes:
      - ./web-manager-data:/web-manager-data
    depends_on:
      beets:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8337/api/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
