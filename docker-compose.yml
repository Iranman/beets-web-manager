# Production Docker Compose file for Beets Web Manager stack.
# Deploys both Beets and Beets Web Manager using published images.
#
# Usage:
#   docker compose up -d

services:
  beets:
    image: lscr.io/linuxserver/beets:2.13.1
    container_name: beets
    restart: unless-stopped
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
    volumes:
      - ${BEETS_CONFIG_PATH:-./beets}:/config
      - ${MUSIC_PATH:-./music}:/music
      - ${DOWNLOADS_PATH:-./downloads}:/downloads

  beets-web-manager:
    image: ghcr.io/iranman/beets-web-manager:stable
    container_name: beets-web-manager
    restart: unless-stopped
    ports:
      - "${WEBCONTROL_PORT:-8337}:8337"
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
      WEBCONTROL_PORT: 8337
    volumes:
      - ${BEETS_CONFIG_PATH:-./beets}:/config
      - ${MUSIC_PATH:-./music}:/music
      - ${DOWNLOADS_PATH:-./downloads}:/downloads
      - ${WEB_MANAGER_DATA_PATH:-./web-manager}:/data
    depends_on:
      - beets
