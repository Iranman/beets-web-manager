# Single-container Docker Compose for Beets Web Manager with Beets embedded
# (ADR 0006, docs/adr/0006-embedded-beets.md).
#
# Beets runs inside Web Manager as a pinned Python library: no separate Beets
# container, no BEETS_WEB_URL, no plugin provisioning. Web Manager reads the
# same Beets config.yaml (from /config, BEETSDIR) and opens the same
# musiclibrary.blb and music folder the Beets container used, so an existing
# two-container install can switch to this file and back (docs/INSTALLATION.md,
# "Run Beets inside Web Manager").
#
# The default docker-compose.yml still runs the two-container (http) stack
# until the Phase 2 cutover; this file opts in with BEETS_ENGINE=embedded.
#
# Before the first start from an existing two-container install: back up
# /config/musiclibrary.blb and stop the `beets` container. Only one process
# may write the library.
#
# Usage:
#   docker compose -f examples/docker-compose.embedded.yml up -d

services:
  beets-web-manager:
    image: ghcr.io/iranman/beets-web-manager:latest
    container_name: beets-web-manager
    restart: unless-stopped

    ports:
      - "${BEETS_WEB_BIND_ADDRESS:-127.0.0.1}:${WEBCONTROL_PORT:-8337}:8337"

    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
      WEBCONTROL_PORT: 8337

      # Run Beets in-process. Remove this line (or set http) to go back to
      # the separate Beets container.
      BEETS_ENGINE: embedded

      # Container-side paths. They must match the mount targets below and
      # Beets' own `directory:` and `library:` in config.yaml.
      MUSIC_ROOT: /music
      DOWNLOADS_ROOT: /downloads
      BEETS_CONFIG: /config/config.yaml

      WEB_MANAGER_DATA_DIR: /web-manager-data
      BEETS_TRANSACTION_DIR: /web-manager-data/transactions

      # Optional; .env.example documents each. None is needed to reach the
      # browser setup wizard.
      BEETS_WEB_USERNAME: ${BEETS_WEB_USERNAME:-}
      BEETS_WEB_PASSWORD: ${BEETS_WEB_PASSWORD:-}
      BEETS_WEB_AUTH_TOKEN: ${BEETS_WEB_AUTH_TOKEN:-}
      BEETS_WEB_AUTH_DISABLED: ${BEETS_WEB_AUTH_DISABLED:-0}
      BEETS_TRUSTED_PROXIES: ${BEETS_TRUSTED_PROXIES:-}

      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-}
      ACOUSTID_API_KEY: ${ACOUSTID_API_KEY:-}
      ACOUSTID_USER_KEY: ${ACOUSTID_USER_KEY:-}
      ACOUSTID_KEY: ${ACOUSTID_KEY:-}
      DISCOGS_TOKEN: ${DISCOGS_TOKEN:-}
      LISTENBRAINZ_TOKEN: ${LISTENBRAINZ_TOKEN:-}
      PLEX_URL: ${PLEX_URL:-}
      PLEX_TOKEN: ${PLEX_TOKEN:-}
      LIDARR_URL: ${LIDARR_URL:-}
      LIDARR_API_KEY: ${LIDARR_API_KEY:-}
      SLSKD_URL: ${SLSKD_URL:-}
      SLSKD_API_KEY: ${SLSKD_API_KEY:-}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
      DEMO_MODE: ${DEMO_MODE:-0}

    volumes:
      # Beets config.yaml and musiclibrary.blb: the same folder the Beets
      # container mounted at /config.
      - ${BEETS_CONFIG_PATH:-./beets}:/config
      # Read-write: Beets now moves, tags and imports files from this process.
      - ${MUSIC_PATH:-${MUSIC_LIBRARY_PATH:-./music}}:/music
      - ${DOWNLOADS_PATH:-${DOWNLOAD_PATH:-./downloads}}:/downloads
      - ${WEB_MANAGER_DATA_PATH:-${BEETS_WEB_MANAGER_DATA_PATH:-./web-manager}}:/web-manager-data

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=512m
      - /run:rw,nosuid,nodev,size=64m

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8337/api/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
