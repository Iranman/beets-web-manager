# Standalone Docker Compose configuration for Beets Web Manager.
# Connects to an existing, separately-managed stock lscr.io/linuxserver/beets
# instance (e.g. one already running on another host/stack, such as a NAS)
# over HTTP via BEETS_WEB_URL -- no BEETS_API_URL/BEETS_API_TOKEN, no
# control agent, no second Beets container started by this file.
#
# The remote Beets instance must already have the `web` and `webmanager`
# plugins enabled in its own config.yaml (see config.yaml.example) and the
# `webmanager` plugin's files provisioned into its own /config/beetsplug --
# this file's beets-web-manager service cannot write to a filesystem it
# does not mount, so it cannot provision that plugin automatically the way
# the standard two-service docker-compose.yml does. Provision it once,
# manually, by copying beetsplug/webmanager/ into the remote instance's
# /config/beetsplug and restarting it.
#
# Uses the published GHCR container image -- no local source or Dockerfile
# required.
#
# Usage:
#   docker compose -f examples/docker-compose.external-beets.yml up -d

services:
  beets-web-manager:
    image: ghcr.io/iranman/beets-web-manager:${BEETS_WEB_MANAGER_VERSION:-stable}
    container_name: beets-web-manager
    restart: unless-stopped

    ports:
      - "${BEETS_WEB_BIND_ADDRESS:-127.0.0.1}:${WEBCONTROL_PORT:-8337}:8337"

    environment:
      TZ: ${TZ:-UTC}
      WEBCONTROL_PORT: 8337

      # Point this at the remote stock Beets instance's own web/webmanager
      # plugin port, e.g. http://192.168.1.50:8337.
      BEETS_WEB_URL: ${BEETS_WEB_URL:?set BEETS_WEB_URL in .env}
      BEETS_OUTBOUND_ALLOWLIST: ${BEETS_OUTBOUND_ALLOWLIST:?set BEETS_OUTBOUND_ALLOWLIST in .env to match the host:port in BEETS_WEB_URL}

      BEETS_WEB_AUTH_TOKEN: ${BEETS_WEB_AUTH_TOKEN:-}
      BEETS_WEB_AUTH_TOKEN_FILE: /web-manager-data/.auth_token
      WEB_MANAGER_DATA_DIR: /web-manager-data
      BEETS_TRANSACTION_DIR: /web-manager-data/transactions
      BEETS_WEB_USERNAME: ${BEETS_WEB_USERNAME:-}
      BEETS_WEB_PASSWORD: ${BEETS_WEB_PASSWORD:-}
      BEETS_WEB_AUTH_DISABLED: ${BEETS_WEB_AUTH_DISABLED:-0}
      BEETS_TRUSTED_PROXIES: ${BEETS_TRUSTED_PROXIES:-}

      BEETS_ARTIST_RECONCILE_TIMEOUT_SECONDS: ${BEETS_ARTIST_RECONCILE_TIMEOUT_SECONDS:-120}
      BEETS_LONG_OPERATION_POLL_SECONDS: ${BEETS_LONG_OPERATION_POLL_SECONDS:-5}
      BEETS_LONG_OPERATION_MAX_SECONDS: ${BEETS_LONG_OPERATION_MAX_SECONDS:-600}

      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-}
      ACOUSTID_API_KEY: ${ACOUSTID_API_KEY:-}
      ACOUSTID_KEY: ${ACOUSTID_KEY:-}
      PLEX_URL: ${PLEX_URL:-}
      PLEX_TOKEN: ${PLEX_TOKEN:-}
      LIDARR_URL: ${LIDARR_URL:-}
      LIDARR_API_KEY: ${LIDARR_API_KEY:-}
      SLSKD_URL: ${SLSKD_URL:-}
      SLSKD_API_KEY: ${SLSKD_API_KEY:-}
      DISCOGS_TOKEN: ${DISCOGS_TOKEN:-}
      DISCOGS_USER_TOKEN: ${DISCOGS_USER_TOKEN:-}
      LISTENBRAINZ_TOKEN: ${LISTENBRAINZ_TOKEN:-}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
      YTDLP_PO_PROVIDER_URL: ${YTDLP_PO_PROVIDER_URL:-}
      DEMO_MODE: ${DEMO_MODE:-0}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}

    volumes:
      - ${BEETS_WEB_MANAGER_DATA_PATH:-./web-manager-data}:/web-manager-data

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    read_only: true

    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=512m
      - /run:rw,nosuid,nodev,size=64m

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8337/api/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
