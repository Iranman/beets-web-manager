# Source Development Docker Compose file for Beets Web Manager.
# Builds Web Manager (with Beets inside it, ADR 0006) from the current
# source tree.
#
# Usage, from the repository root:
#   docker compose -f docker-compose.dev.yml up -d --build

services:
  beets-web-manager:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VCS_REF: ${VCS_REF:-local-development}
        # Labels the local build (and its BUILD_INFO.json); "dev" like the
        # Dockerfile's own default, never a stale release number.
        VERSION: ${VERSION:-dev}
        BUILD_DATE: ${BUILD_DATE:-}
    image: beets-web-manager:dev
    container_name: beets-web-manager-dev
    restart: unless-stopped
    ports:
      - "${BEETS_WEB_BIND_ADDRESS:-127.0.0.1}:${WEBCONTROL_PORT:-8337}:8337"
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
      WEBCONTROL_PORT: 8337

      # Container-side paths. They must match the mount targets below, and
      # MUSIC_ROOT must equal Beets' own `directory:` (see
      # docs/CONFIGURATION.md). Change them only together.
      MUSIC_ROOT: /music
      DOWNLOADS_ROOT: /downloads
      BEETS_CONFIG: /config/config.yaml
      WEB_MANAGER_DATA_DIR: /web-manager-data
      BEETS_TRANSACTION_DIR: /web-manager-data/transactions

      BEETS_WEB_USERNAME: ${BEETS_WEB_USERNAME:-}
      BEETS_WEB_PASSWORD: ${BEETS_WEB_PASSWORD:-}
      BEETS_WEB_AUTH_TOKEN: ${BEETS_WEB_AUTH_TOKEN:-}
      BEETS_WEB_AUTH_DISABLED: ${BEETS_WEB_AUTH_DISABLED:-0}
      BEETS_TRUSTED_PROXIES: ${BEETS_TRUSTED_PROXIES:-}

      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-}

      ACOUSTID_API_KEY: ${ACOUSTID_API_KEY:-}
      ACOUSTID_USER_KEY: ${ACOUSTID_USER_KEY:-}
      ACOUSTID_KEY: ${ACOUSTID_KEY:-}
      DISCOGS_TOKEN: ${DISCOGS_TOKEN:-}
      LISTENBRAINZ_TOKEN: ${LISTENBRAINZ_TOKEN:-}

      PLEX_URL: ${PLEX_URL:-}
      PLEX_TOKEN: ${PLEX_TOKEN:-}
      LIDARR_URL: ${LIDARR_URL:-}
      LIDARR_API_KEY: ${LIDARR_API_KEY:-}

      SLSKD_URL: ${SLSKD_URL:-}
      SLSKD_API_KEY: ${SLSKD_API_KEY:-}

      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}

      DEMO_MODE: ${DEMO_MODE:-0}
    volumes:
      - ${BEETS_CONFIG_PATH:-./beets}:/config
      - ${MUSIC_PATH:-${MUSIC_LIBRARY_PATH:-./music}}:/music
      - ${DOWNLOADS_PATH:-${DOWNLOAD_PATH:-./downloads}}:/downloads
      - ${WEB_MANAGER_DATA_PATH:-${BEETS_WEB_MANAGER_DATA_PATH:-./web-manager}}:/web-manager-data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json, sys, urllib.request; d = json.load(urllib.request.urlopen('http://127.0.0.1:8337/api/health', timeout=5)); sys.exit(0 if d.get('beets', {}).get('ok') else 1)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
