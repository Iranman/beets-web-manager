# Source Development Docker Compose file for Beets Web Manager stack.
# Builds the Web Manager service locally from the current source tree,
# running alongside the stock LinuxServer Beets container.
#
# Usage:
#   docker compose -f docker-compose.dev.yml up -d --build

services:
  beets:
    image: ${BEETS_BASE_IMAGE:-lscr.io/linuxserver/beets:latest}
    container_name: beets-dev
    restart: unless-stopped
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
    volumes:
      - ${BEETS_CONFIG_PATH:-./beets}:/config
      - ${MUSIC_PATH:-./music}:/music
      - ${DOWNLOADS_PATH:-./downloads}:/downloads
    expose:
      - "8337"
    # See the primary docker-compose.yml: Web Manager provisions the
    # webmanager plugin into config.yaml at its own startup, before this
    # dev build of stock Beets ever reads that file.
    depends_on:
      beets-web-manager:
        condition: service_healthy

  beets-web-manager:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VCS_REF: ${VCS_REF:-local-development}
        VERSION: ${VERSION:-0.1.18-dev}
        BUILD_DATE: ${BUILD_DATE:-}
    image: beets-web-manager:dev
    container_name: beets-web-manager-dev
    restart: unless-stopped
    ports:
      - "${BEETS_WEB_BIND_ADDRESS:-127.0.0.1}:${WEBCONTROL_PORT:-8337}:8337"
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
      WEBCONTROL_PORT: 8337

      BEETS_WEB_URL: http://beets:8337
      BEETS_OUTBOUND_ALLOWLIST: beets:8337
      WEB_MANAGER_DATA_DIR: /web-manager-data
      BEETS_TRANSACTION_DIR: /web-manager-data/transactions

      BEETS_WEB_USERNAME: ${BEETS_WEB_USERNAME:-}
      BEETS_WEB_PASSWORD: ${BEETS_WEB_PASSWORD:-}
      BEETS_WEB_AUTH_TOKEN: ${BEETS_WEB_AUTH_TOKEN:-}
      BEETS_WEB_AUTH_DISABLED: ${BEETS_WEB_AUTH_DISABLED:-0}
      BEETS_TRUSTED_PROXIES: ${BEETS_TRUSTED_PROXIES:-}

      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-}

      ACOUSTID_API_KEY: ${ACOUSTID_API_KEY:-}
      DISCOGS_TOKEN: ${DISCOGS_TOKEN:-}
      LISTENBRAINZ_TOKEN: ${LISTENBRAINZ_TOKEN:-}

      PLEX_URL: ${PLEX_URL:-}
      PLEX_TOKEN: ${PLEX_TOKEN:-}
      LIDARR_URL: ${LIDARR_URL:-}
      LIDARR_API_KEY: ${LIDARR_API_KEY:-}

      SLSKD_URL: ${SLSKD_URL:-}
      SLSKD_API_KEY: ${SLSKD_API_KEY:-}

      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}

      DEMO_MODE: ${DEMO_MODE:-0}
    volumes:
      - ${BEETS_CONFIG_PATH:-./beets}:/config
      - ${MUSIC_PATH:-./music}:/music:ro
      - ${DOWNLOADS_PATH:-./downloads}:/downloads
      - ${WEB_MANAGER_DATA_PATH:-./web-manager}:/web-manager-data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8337/api/health', timeout=5)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
