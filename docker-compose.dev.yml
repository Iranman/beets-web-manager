# Source Development Docker Compose file for Beets Web Manager stack.
# Builds the Web Manager service locally from the current source tree,
# running alongside the stock LinuxServer Beets container.
#
# Usage:
#   docker compose -f docker-compose.dev.yml up -d --build

services:
  beets:
    image: ${BEETS_BASE_IMAGE:-lscr.io/linuxserver/beets:2.13.1}
    container_name: beets-dev
    restart: unless-stopped
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
    volumes:
      - ${BEETS_CONFIG_PATH:-./beets}:/config
      - ${MUSIC_PATH:-./music}:/music
      - ${DOWNLOADS_PATH:-./downloads}:/downloads

  beets-web-manager:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VCS_REF: ${VCS_REF:-local-development}
        VERSION: ${VERSION:-0.1.17-dev}
        BUILD_DATE: ${BUILD_DATE:-}
    image: beets-web-manager:dev
    container_name: beets-web-manager-dev
    restart: unless-stopped
    ports:
      - "${BEETS_WEB_BIND_ADDRESS:-127.0.0.1}:${WEBCONTROL_PORT:-8337}:8337"
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
      WEBCONTROL_PORT: 8337
      DEMO_MODE: ${DEMO_MODE:-0}
    volumes:
      - ${BEETS_CONFIG_PATH:-./beets}:/config
      - ${MUSIC_PATH:-./music}:/music
      - ${DOWNLOADS_PATH:-./downloads}:/downloads
      - ${WEB_MANAGER_DATA_PATH:-./web-manager}:/data
    depends_on:
      - beets
