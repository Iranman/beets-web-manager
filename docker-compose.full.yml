# ==============================================================================
# [ADVANCED] Beets Web Manager with the yt-dlp PO-token provider
# ==============================================================================
# The primary `docker-compose.yml` (one container, Beets inside Web Manager,
# ADR 0006), plus the bgutil-ytdlp-pot-provider service some yt-dlp downloads
# need, and the web port bound to loopback by default.
#
# Usage, from the folder that holds this file:
#   docker compose -f docker-compose.full.yml up -d

services:
  bgutil-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:2.0.2-deno@sha256:addc137188b8f2be54b17bb0a919a3847cd417d143162e74d2fe9b410e586bcd
    container_name: bgutil-provider
    restart: unless-stopped
    expose:
      - "4416"

  beets-web-manager:
    image: ghcr.io/iranman/beets-web-manager:latest
    container_name: beets-web-manager
    restart: unless-stopped

    ports:
      - "${BEETS_WEB_BIND_ADDRESS:-127.0.0.1}:${WEBCONTROL_PORT:-8337}:8337"

    environment:
      TZ: ${TZ:-UTC}
      WEBCONTROL_PORT: 8337

      BEETS_WEB_AUTH_TOKEN: ${BEETS_WEB_AUTH_TOKEN:-}
      BEETS_WEB_AUTH_TOKEN_FILE: /web-manager-data/.auth_token
      WEB_MANAGER_DATA_DIR: /web-manager-data
      BEETS_TRANSACTION_DIR: /web-manager-data/transactions
      BEETS_WEB_USERNAME: ${BEETS_WEB_USERNAME:-}
      BEETS_WEB_PASSWORD: ${BEETS_WEB_PASSWORD:-}
      BEETS_WEB_AUTH_DISABLED: ${BEETS_WEB_AUTH_DISABLED:-0}
      BEETS_TRUSTED_PROXIES: ${BEETS_TRUSTED_PROXIES:-}
      BEETS_OUTBOUND_ALLOWLIST: ${BEETS_OUTBOUND_ALLOWLIST:-bgutil-provider:4416}

      # Hotfix v0.1.17 (BUG-4): operation-specific timeout/poll bounds for
      # the artist-folder-reconcile long controlled mutation only -- not a
      # global Beets API timeout. See
      # app.py's _apply_artist_folder_reconcile_resilient().
      BEETS_ARTIST_RECONCILE_TIMEOUT_SECONDS: ${BEETS_ARTIST_RECONCILE_TIMEOUT_SECONDS:-120}
      BEETS_LONG_OPERATION_POLL_SECONDS: ${BEETS_LONG_OPERATION_POLL_SECONDS:-5}
      BEETS_LONG_OPERATION_MAX_SECONDS: ${BEETS_LONG_OPERATION_MAX_SECONDS:-600}

      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-}
      ACOUSTID_API_KEY: ${ACOUSTID_API_KEY:-}
      ACOUSTID_USER_KEY: ${ACOUSTID_USER_KEY:-}
      ACOUSTID_KEY: ${ACOUSTID_KEY:-}
      PLEX_URL: ${PLEX_URL:-}
      PLEX_TOKEN: ${PLEX_TOKEN:-}
      LIDARR_URL: ${LIDARR_URL:-}
      LIDARR_API_KEY: ${LIDARR_API_KEY:-}
      SLSKD_URL: ${SLSKD_URL:-}
      SLSKD_API_KEY: ${SLSKD_API_KEY:-}
      DISCOGS_TOKEN: ${DISCOGS_TOKEN:-}
      DISCOGS_USER_TOKEN: ${DISCOGS_USER_TOKEN:-}
      LISTENBRAINZ_TOKEN: ${LISTENBRAINZ_TOKEN:-}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
      YTDLP_PO_PROVIDER_URL: ${YTDLP_PO_PROVIDER_URL:-http://bgutil-provider:4416}
      RECOVER_OWNED_ACCOUNTS: ${RECOVER_OWNED_ACCOUNTS:-}
      DEMO_MODE: ${DEMO_MODE:-0}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}

      # Container-side paths: must match the mounts below; MUSIC_ROOT must
      # equal Beets' `directory:` in config.yaml.
      MUSIC_ROOT: /music
      DOWNLOADS_ROOT: /downloads
      BEETS_CONFIG: /config/config.yaml

    volumes:
      - ${BEETS_CONFIG_PATH:-./config}:/config
      # Read-write: Beets moves, tags and imports files from this container.
      - ${MUSIC_LIBRARY_PATH:-./data/music}:/music
      - ${DOWNLOAD_PATH:-./data/downloads}:/downloads
      - ${BEETS_WEB_MANAGER_DATA_PATH:-./web-manager-data}:/web-manager-data

    security_opt:
      - no-new-privileges:true

    # BI-8: drop everything, then add back only what the entrypoint's brief
    # root phase needs -- CHOWN to fix bind-mount ownership, SETUID/SETGID
    # for gosu to drop to PUID:PGID. After gosu the app runs as a non-root
    # user and holds no capabilities (no-new-privileges stops regaining them).
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID

    read_only: true

    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=512m
      - /run:rw,nosuid,nodev,size=64m

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json, sys, urllib.request; d = json.load(urllib.request.urlopen('http://127.0.0.1:8337/api/health', timeout=5)); sys.exit(0 if d.get('beets', {}).get('ok') else 1)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
