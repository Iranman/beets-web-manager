# Optional Bundled Beets Stack (Advanced Users)
#
# IMPORTANT NOTICE:
# 1. This file builds the custom Beets engine locally from Dockerfile.beets.
# 2. It REQUIRES a full repository checkout to build the beets service.
# 3. 'beets-engine:local' is a LOCAL image tag built from source, NOT a public Docker Hub image.
# 4. Running this file outside the repository root without building the engine will fail with:
#      "pull access denied for beets-engine"
# 5. For standard production deployments without host source code, use the primary docker-compose.yml
#    and connect to an existing Beets control agent.
# 6. BEETS_BASE_IMAGE selects the upstream LinuxServer Beets version/digest to build from
#    (default: the tested production candidate). Set BEETS_BASE_IMAGE=lscr.io/linuxserver/beets:latest
#    for advanced compatibility testing only -- never as a production default.
#
# Usage:
#   docker compose -f docker-compose.full.yml up -d --build

services:
  beets:
    build:
      context: .
      dockerfile: Dockerfile.beets
      args:
        BEETS_BASE_IMAGE: ${BEETS_BASE_IMAGE:-lscr.io/linuxserver/beets:2.13.1}
        VCS_REF: ${VCS_REF:-local-build}
    image: beets-engine:local
    container_name: beets
    restart: unless-stopped
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-America/Los_Angeles}
      - BEETSDIR=/config
      - BEETS_API_TOKEN=${BEETS_API_TOKEN:?set BEETS_API_TOKEN in .env}
      - BEETS_AGENT_PORT=8338
    volumes:
      - ./config:/config
      - ${MUSIC_LIBRARY_PATH:-./data/music}:/data/media/music
      - ${DOWNLOAD_PATH:-./data/downloads}:/data/torrents
    expose:
      - "8338"
    healthcheck:
      test: ["CMD", "/lsiopy/bin/python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8338/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 3

  beets-web-manager:
    image: ghcr.io/iranman/beets-web-manager:${BEETS_WEB_MANAGER_VERSION:-stable}
    container_name: beets-web-manager
    restart: unless-stopped

    ports:
      - "${BEETS_WEB_BIND_ADDRESS:-127.0.0.1}:${WEBCONTROL_PORT:-8337}:8337"

    environment:
      TZ: ${TZ:-America/Los_Angeles}
      WEBCONTROL_PORT: ${WEBCONTROL_PORT:-8337}

      BEETS_API_URL: ${BEETS_API_URL:-http://beets:8338}
      BEETS_API_TOKEN: ${BEETS_API_TOKEN:?set BEETS_API_TOKEN in .env}

      BEETS_WEB_AUTH_TOKEN: ${BEETS_WEB_AUTH_TOKEN:-}
      BEETS_WEB_AUTH_TOKEN_FILE: /web-manager-data/.auth_token
      BEETS_WEB_USERNAME: ${BEETS_WEB_USERNAME:-admin}
      BEETS_WEB_PASSWORD: ${BEETS_WEB_PASSWORD:-}
      BEETS_WEB_AUTH_DISABLED: ${BEETS_WEB_AUTH_DISABLED:-0}
      BEETS_TRUSTED_PROXIES: ${BEETS_TRUSTED_PROXIES:-}
      BEETS_OUTBOUND_ALLOWLIST: ${BEETS_OUTBOUND_ALLOWLIST:-beets:8338}

      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-}
      ACOUSTID_API_KEY: ${ACOUSTID_API_KEY:-}
      PLEX_URL: ${PLEX_URL:-}
      PLEX_TOKEN: ${PLEX_TOKEN:-}
      LIDARR_URL: ${LIDARR_URL:-}
      LIDARR_API_KEY: ${LIDARR_API_KEY:-}
      SLSKD_URL: ${SLSKD_URL:-}
      SLSKD_API_KEY: ${SLSKD_API_KEY:-}
      DISCOGS_TOKEN: ${DISCOGS_TOKEN:-}
      LISTENBRAINZ_TOKEN: ${LISTENBRAINZ_TOKEN:-}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
      YTDLP_PO_PROVIDER_URL: ${YTDLP_PO_PROVIDER_URL:-}
      DEMO_MODE: ${DEMO_MODE:-0}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}

    volumes:
      - ${BEETS_WEB_MANAGER_DATA_PATH:-./web-manager-data}:/web-manager-data

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    read_only: true

    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=512m
      - /run:rw,nosuid,nodev,size=64m

    depends_on:
      beets:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8337/api/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
