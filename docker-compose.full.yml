# ==============================================================================
# [ADVANCED] Hardened stock-Beets stack, with the yt-dlp PO-token provider
# ==============================================================================
# Same two-service stock-Beets architecture as the primary `docker-compose.yml`
# (no build, no custom Beets image, no control agent, no port 8338) --
# this variant additionally applies container security hardening
# (read_only rootfs, cap_drop: ALL, no-new-privileges) to beets-web-manager
# and starts the bgutil-ytdlp-pot-provider service some yt-dlp downloads need.
#
# Usage:
#   docker compose -f docker-compose.full.yml up -d

services:
  beets:
    image: lscr.io/linuxserver/beets:latest
    container_name: beets
    restart: unless-stopped
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
    volumes:
      - ${BEETS_CONFIG_PATH:-./config}:/config
      - ${MUSIC_LIBRARY_PATH:-./data/music}:/music
      - ${DOWNLOAD_PATH:-./data/downloads}:/downloads
    expose:
      - "8337"
    # See the primary docker-compose.yml for why this depends on
    # beets-web-manager's healthcheck rather than the other way around:
    # Web Manager provisions the webmanager plugin into config.yaml at its
    # own startup, before stock Beets ever reads that file.
    depends_on:
      beets-web-manager:
        condition: service_healthy

  # Included by default so yt-dlp YouTube downloads work out of the box
  # (YouTube's PO token requirement). This service starts unconditionally
  # and beets-web-manager's YTDLP_PO_PROVIDER_URL default points at it below
  # -- it is not conditionally enabled. If you don't use the ytdlp
  # acquisition method, remove this service and blank YTDLP_PO_PROVIDER_URL.
  bgutil-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:1.3.1-deno
    container_name: bgutil-provider
    restart: unless-stopped
    expose:
      - "4416"

  beets-web-manager:
    image: ghcr.io/iranman/beets-web-manager:${BEETS_WEB_MANAGER_VERSION:-stable}
    container_name: beets-web-manager
    restart: unless-stopped

    ports:
      - "${BEETS_WEB_BIND_ADDRESS:-127.0.0.1}:${WEBCONTROL_PORT:-8337}:8337"

    environment:
      TZ: ${TZ:-UTC}
      WEBCONTROL_PORT: 8337

      BEETS_WEB_URL: ${BEETS_WEB_URL:-http://beets:8337}

      BEETS_WEB_AUTH_TOKEN: ${BEETS_WEB_AUTH_TOKEN:-}
      BEETS_WEB_AUTH_TOKEN_FILE: /web-manager-data/.auth_token
      WEB_MANAGER_DATA_DIR: /web-manager-data
      BEETS_TRANSACTION_DIR: /web-manager-data/transactions
      BEETS_WEB_USERNAME: ${BEETS_WEB_USERNAME:-}
      BEETS_WEB_PASSWORD: ${BEETS_WEB_PASSWORD:-}
      BEETS_WEB_AUTH_DISABLED: ${BEETS_WEB_AUTH_DISABLED:-0}
      BEETS_TRUSTED_PROXIES: ${BEETS_TRUSTED_PROXIES:-}
      BEETS_OUTBOUND_ALLOWLIST: ${BEETS_OUTBOUND_ALLOWLIST:-beets:8337}

      # Hotfix v0.1.17 (BUG-4): operation-specific timeout/poll bounds for
      # the artist-folder-reconcile long controlled mutation only -- not a
      # global Beets API timeout. See
      # app.py's _apply_artist_folder_reconcile_resilient().
      BEETS_ARTIST_RECONCILE_TIMEOUT_SECONDS: ${BEETS_ARTIST_RECONCILE_TIMEOUT_SECONDS:-120}
      BEETS_LONG_OPERATION_POLL_SECONDS: ${BEETS_LONG_OPERATION_POLL_SECONDS:-5}
      BEETS_LONG_OPERATION_MAX_SECONDS: ${BEETS_LONG_OPERATION_MAX_SECONDS:-600}

      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-}
      ACOUSTID_API_KEY: ${ACOUSTID_API_KEY:-}
      ACOUSTID_KEY: ${ACOUSTID_KEY:-}
      PLEX_URL: ${PLEX_URL:-}
      PLEX_TOKEN: ${PLEX_TOKEN:-}
      LIDARR_URL: ${LIDARR_URL:-}
      LIDARR_API_KEY: ${LIDARR_API_KEY:-}
      SLSKD_URL: ${SLSKD_URL:-}
      SLSKD_API_KEY: ${SLSKD_API_KEY:-}
      DISCOGS_TOKEN: ${DISCOGS_TOKEN:-}
      DISCOGS_USER_TOKEN: ${DISCOGS_USER_TOKEN:-}
      LISTENBRAINZ_TOKEN: ${LISTENBRAINZ_TOKEN:-}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
      YTDLP_PO_PROVIDER_URL: ${YTDLP_PO_PROVIDER_URL:-http://bgutil-provider:4416}
      DEMO_MODE: ${DEMO_MODE:-0}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}

    volumes:
      - ${BEETS_CONFIG_PATH:-./config}:/config
      - ${MUSIC_LIBRARY_PATH:-./data/music}:/music:ro
      - ${DOWNLOAD_PATH:-./data/downloads}:/downloads
      - ${BEETS_WEB_MANAGER_DATA_PATH:-./web-manager-data}:/web-manager-data

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    read_only: true

    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=512m
      - /run:rw,nosuid,nodev,size=64m

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8337/api/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
