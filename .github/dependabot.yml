version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Bump React and its types together; split PRs leave peer ranges out of sync.
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    ignore:
      # The frontend build stage tracks Node LTS (even majors). Odd majors are
      # short-lived "Current" releases that never become LTS.
      - dependency-name: node
        versions: [">= 25, < 26", ">= 27, < 28", ">= 29, < 30", ">= 31, < 32"]
  # The `docker` ecosystem reads Dockerfiles only; this one bumps the
  # digest-pinned third-party images in the compose files (e.g. the
  # bgutil-provider sidecar).
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    ignore:
      # Deliberately tracked by its `:latest` tag (project decision).
      # The `*` form (dependency-name accepts wildcards) also matches if
      # Dependabot names the image without its registry host.
      # lscr.io/linuxserver/beets is NOT ignored: it is pinned (tag@digest)
      # and Dependabot proposes each bump as a PR, which re-runs the
      # stock-Beets acceptance against the new pin. Review it with
      # "Upgrading the pinned Beets image" in docs/BEETS_ENGINE_MIGRATION.md.
      - dependency-name: ghcr.io/iranman/beets-web-manager
      - dependency-name: "*iranman/beets-web-manager"
