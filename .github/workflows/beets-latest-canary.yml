name: beets-latest-canary

# Early warning, never a gate. The image and every required CI job use the
# Beets pinned in requirements.txt. This workflow runs the embedded-Beets
# acceptance against the newest Beets release on PyPI once a week, so an
# upstream change that would break Web Manager (e.g. Beets 2.13 genre->genres,
# 2.14 relative paths) shows up as a failed scheduled run before anyone bumps
# the pin. Schedule and on demand only -- never on pull requests.
# To act on a failure: see "Upgrading the pinned Beets" in
# docs/BEETS_ENGINE_MIGRATION.md.

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  beets-latest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install the image's dependencies, then the newest Beets
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libchromaprint-tools
          pip install -r requirements.txt
          pip install --upgrade beets
          python -c "import beets; print('Beets', beets.__version__)"
      - name: Accept the installed Beets in this throwaway checkout only
        # The product refuses any Beets but its pin (beets_version_mismatch);
        # the canary edits that constant here and nowhere else.
        run: |
          v="$(python -c 'import beets; print(beets.__version__)')"
          sed -i "s/^PINNED_BEETS_VERSION = .*/PINNED_BEETS_VERSION = \"$v\"/" backend/beets_embedded.py
          grep -n '^PINNED_BEETS_VERSION' backend/beets_embedded.py
      - name: Embedded Beets acceptance against the newest Beets
        run: >-
          python -m unittest -v
          tests.test_beets_embedded
          tests.test_beets_embedded_parity
          tests.test_beets_embedded_autotag
          tests.test_stock_beets_acceptance
          tests.test_beets214_item_paths
