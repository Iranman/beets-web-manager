name: unit-tests

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: Install real Beets for engine-side native path-formatting tests
        # backend/transaction_engine.py's album_relocation_v1 /
        # album_metadata_repair_v1 families ask the REAL installed Beets
        # for path/tag decisions (Wave 24 final review section 7/8/28) --
        # deliberately not a hand-rolled duplicate formatter. That code
        # only runs where `beets` is genuinely importable, matching the
        # beets-engine container (Dockerfile.beets, built FROM
        # lscr.io/linuxserver/beets:2.13.1) it actually executes in.
        # requirements.txt intentionally omits the full `beets` package to
        # keep the Web Manager image itself dependency-light (only
        # `mediafile`, its tag-I/O component, is a real dependency there);
        # this step is CI-test-only, pinned to the exact version the
        # engine container bundles, so this suite exercises the real
        # native-Beets code path instead of only ever hitting its
        # explicit, fail-closed "unavailable" branch.
        run: pip install beets==2.13.1
      - name: Set a fake CI-only web auth token
        # Prevents _bootstrap_auth_token_if_missing() from generating and
        # attempting to persist a token to the (unwritable, non-container)
        # /web-manager-data default on this runner -- which would now fail
        # startup closed (see app.py) instead of silently degrading. Not a
        # real secret; set via $GITHUB_ENV rather than a workflow `env:`
        # assignment so scripts/security_secret_scan.py's config-secret-
        # assignment check (which only allowlists the literal word
        # "changeme" for YAML `KEY: value` nodes) doesn't need a bespoke
        # exception for a value that has to fail the app's own placeholder
        # check.
        run: echo "BEETS_WEB_AUTH_TOKEN=ci-unit-test-token-not-a-real-secret-0000000000" >> "$GITHUB_ENV"
      - run: python -m py_compile app.py helpers_mb.py job_engine.py routes_jobs.py routes_lidarr.py routes_setup.py scripts/security_secret_scan.py scripts/validate_compose_security.py scripts/verify_security_config.py
      - run: python -m unittest discover -s tests -p "test_*.py"
