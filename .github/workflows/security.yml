name: security

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Secret scan
        run: python3 scripts/security_secret_scan.py

      - name: Endpoint security inventory is up to date
        # Regenerate-and-diff, not a second hand-maintained guess: catches
        # the exact failure mode that let security/endpoint_inventory.json
        # go stale for 11 months (routes_setup.py, routes_lidarr.py,
        # routes_submissions.py, and dozens of app.py routes were never
        # added to the audit trail -- see docs/TECHNICAL_DEBT.md ARCH-013).
        run: python3 scripts/generate_endpoint_inventory.py --check

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Set a fake CI-only web auth token
        # See unit-tests.yml for why this is a $GITHUB_ENV append rather
        # than a workflow `env:` assignment.
        run: echo "BEETS_WEB_AUTH_TOKEN=ci-unit-test-token-not-a-real-secret-0000000000" >> "$GITHUB_ENV"

      - name: Python syntax and security regression tests
        run: |
          python3 -m py_compile app.py tests/test_security_hardening.py scripts/security_secret_scan.py
          python3 -m unittest discover -s tests -p "test_*.py"

      - name: Frontend dependency audit
        working-directory: frontend
        run: |
          npm ci
          npm audit --audit-level=high
          npm run typecheck