name: docker-build

# Production build/verification only -- every job here is a real,
# required check.
#
# Architecture invariant: this repository builds and publishes exactly one
# application image, ghcr.io/iranman/beets-web-manager. There is no custom
# Beets engine image -- Beets itself is the unmodified, official
# lscr.io/linuxserver/beets image, run as its own container and reached
# only over HTTP via the bundled webmanager integration plugin.
# `stock-beets-acceptance` below pulls and runs that actual upstream image
# and exercises the webmanager integration plugin against it over HTTP,
# never building a derived engine image. See
# tests/test_architecture_invariants.py for the CI guard that fails if any
# active workflow tries to build/publish a custom engine image.

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

env:
  # This is a Python *package* version pin for CI-only test fixtures
  # (backend/transaction_engine.py's native-Beets-formatting tests), NOT
  # the deployed Beets container version -- production docker-compose.yml
  # runs the `beets` service on the `:latest` LinuxServer image tag by
  # design (see stock-beets-acceptance below, which is the real `:latest`
  # compatibility lane). Kept in sync with requirements-dev.txt's own
  # `beets==` pin so local `python -m unittest` and CI see the same
  # fixture behavior.
  BEETS_TEST_FIXTURE_VERSION: "2.13.1"

jobs:
  compose-verification:
    runs-on: ubuntu-latest
    env:
      BEETS_WEB_URL: http://beets.ci.invalid:8337
      BEETS_OUTBOUND_ALLOWLIST: beets.ci.invalid:8337
      BEETS_WEB_AUTH_TOKEN: changeme
      OPENAI_API_KEY: changeme
      PLEX_TOKEN: changeme
      LIDARR_API_KEY: changeme
      AI_API_KEY: changeme
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python scripts/validate_compose_security.py
      - run: docker compose -f docker-compose.dev.yml config
      - run: docker compose -f docker-compose.full.yml config
      - run: docker compose -f examples/docker-compose.external-beets.yml config
      - run: docker compose config
      - run: docker build --pull=false --build-arg VCS_REF="${{ github.event.pull_request.head.sha || github.sha }}" -t beets-web-manager:ci .
      - name: Installation smoke test
        run: |
          set -e
          mkdir -p /tmp/beets-ci-config /tmp/beets-ci-music /tmp/beets-ci-downloads
          chmod -R a+rwX /tmp/beets-ci-config /tmp/beets-ci-music /tmp/beets-ci-downloads
          cp config.yaml.example /tmp/beets-ci-config/config.yaml
          docker run -d --name beets-ci \
            -p 18337:8337 \
            -e BEETS_WEB_AUTH_TOKEN=ci-smoke-test-token-not-a-real-secret \
            -e WEBCONTROL_PORT=8337 \
            -v /tmp/beets-ci-config:/config \
            -v /tmp/beets-ci-music:/music \
            -v /tmp/beets-ci-downloads:/downloads \
            beets-web-manager:ci
          alive=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18337/health/live >/dev/null 2>&1; then
              echo "Container is alive after ${i}0s"
              alive=1
              break
            fi
            sleep 10
          done
          echo "--- /health/live ---"
          curl -fsS http://127.0.0.1:18337/health/live || true
          echo "--- /api/setup/status ---"
          curl -fsS -H "Authorization: Bearer ci-smoke-test-token-not-a-real-secret" \
            http://127.0.0.1:18337/api/setup/status || true
          echo "--- container logs (tail) ---"
          docker logs --tail 200 beets-ci || true
          docker stop beets-ci || true
          docker rm beets-ci || true
          if [ "$alive" -ne 1 ]; then
            echo "::error::Container never became healthy within the timeout"
            exit 1
          fi

  stock-beets-acceptance:
    name: stock-beets-acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: pip install beets==${{ env.BEETS_TEST_FIXTURE_VERSION }}
      - name: Record the pulled lscr.io/linuxserver/beets:latest image digest
        # Section 19 provenance requirement: the compatibility lane below
        # floats on `:latest`, so record exactly which digest this run
        # actually tested against.
        run: |
          docker pull lscr.io/linuxserver/beets:latest
          docker inspect --format '{{index .RepoDigests 0}}' lscr.io/linuxserver/beets:latest
      - name: Real Docker acceptance against unmodified lscr.io/linuxserver/beets:latest
        # Never builds or publishes a derived engine image -- pulls and
        # runs the real upstream image as-is, then exercises the
        # webmanager integration plugin against it over HTTP.
        run: python -m unittest tests.test_stock_beets_acceptance -v

  production-docker-acceptance:
    name: production-docker-acceptance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout at exact PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: Run production Docker acceptance
        run: python scripts/verify_production_docker_acceptance.py

  publish-ghcr:
    name: Build & Publish GHCR Image
    needs: [compose-verification, stock-beets-acceptance, production-docker-acceptance]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata for Web Manager
        id: meta_webmanager
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/iranman/beets-web-manager
          # Wave 24 round 4 (CodeQL/provenance closure): metadata-action's
          # git context derives org.opencontainers.image.revision from the
          # GITHUB_SHA env var, which on a pull_request-triggered run is
          # the ephemeral base+head merge commit -- NOT the actual PR head
          # every other provenance check in this workflow (VCS_REF build
          # args, the two-service-acceptance job's own image inspection)
          # is built against. A custom label with the same key overrides
          # the auto-generated one, keeping this the single source of
          # truth for "what commit actually built this image."
          labels: |
            org.opencontainers.image.revision=${{ github.event.pull_request.head.sha || github.sha }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=stable,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Set build date
        id: build_date
        run: echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push Beets Web Manager image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta_webmanager.outputs.tags }}
          labels: ${{ steps.meta_webmanager.outputs.labels }}
          build-args: |
            VCS_REF=${{ github.event.pull_request.head.sha || github.sha }}
            VERSION=${{ steps.meta_webmanager.outputs.version }}
            BUILD_DATE=${{ steps.build_date.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
