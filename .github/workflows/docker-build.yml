name: docker-build

# Production build/verification only -- every job here is a real,
# required check. The informational "does lscr.io/linuxserver/beets:latest
# still build?" comparison lives in its own workflow,
# beets-engine-latest-compat.yml, specifically so an infrastructure hiccup
# or a genuine upstream incompatibility there is reported as its own
# clearly-labeled, independent check rather than as a red mark inside this
# workflow.

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

env:
  # The tested, pinned production Beets version. Update intentionally (a
  # real repository change, with disposable migration testing) -- never let
  # this silently track whatever `latest` happens to resolve to today.
  BEETS_PRODUCTION_VERSION: "2.13.1"

jobs:
  compose-verification:
    runs-on: ubuntu-latest
    env:
      BEETS_API_URL: http://beets.ci.invalid:8338
      BEETS_API_TOKEN: changeme
      BEETS_WEB_AUTH_TOKEN: changeme
      OPENAI_API_KEY: changeme
      PLEX_TOKEN: changeme
      LIDARR_API_KEY: changeme
      AI_API_KEY: changeme
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python scripts/validate_compose_security.py
      - run: docker compose -f docker-compose.dev.yml config
      - run: docker compose -f docker-compose.full.yml config
      - run: docker compose config
      - run: docker build --pull=false --build-arg VCS_REF="${{ github.event.pull_request.head.sha || github.sha }}" -t beets-web-manager:ci .
      - name: Installation smoke test
        run: |
          set -e
          mkdir -p /tmp/beets-ci-config /tmp/beets-ci-music /tmp/beets-ci-downloads
          chmod -R a+rwX /tmp/beets-ci-config /tmp/beets-ci-music /tmp/beets-ci-downloads
          cp config.yaml.example /tmp/beets-ci-config/config.yaml
          docker run -d --name beets-ci \
            -p 18337:8337 \
            -e BEETS_WEB_AUTH_TOKEN=ci-smoke-test-token-not-a-real-secret \
            -e WEBCONTROL_PORT=8337 \
            -v /tmp/beets-ci-config:/config \
            -v /tmp/beets-ci-music:/data/media/music \
            -v /tmp/beets-ci-downloads:/data/torrents \
            beets-web-manager:ci
          alive=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18337/health/live >/dev/null 2>&1; then
              echo "Container is alive after ${i}0s"
              alive=1
              break
            fi
            sleep 10
          done
          echo "--- /health/live ---"
          curl -fsS http://127.0.0.1:18337/health/live || true
          echo "--- /api/setup/status ---"
          curl -fsS -H "Authorization: Bearer ci-smoke-test-token-not-a-real-secret" \
            http://127.0.0.1:18337/api/setup/status || true
          echo "--- container logs (tail) ---"
          docker logs --tail 200 beets-ci || true
          docker stop beets-ci || true
          docker rm beets-ci || true
          if [ "$alive" -ne 1 ]; then
            echo "::error::Container never became healthy within the timeout"
            exit 1
          fi

  beets-engine-verification:
    name: beets-engine-verification (${{ matrix.beets_version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 2.13.1 is the tested production candidate ($BEETS_PRODUCTION_VERSION
        # above). 2.4.0 is tested explicitly because backward compatibility
        # with it (and its narrow plugin-resolution patch) is intentionally
        # retained -- see docker/beets/apply_patches.py.
        beets_version: ["2.13.1", "2.4.0"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Build Beets engine image
        run: |
          docker build --pull=false \
            --build-arg BEETS_BASE_IMAGE="lscr.io/linuxserver/beets:${{ matrix.beets_version }}" \
            --build-arg VCS_REF="${{ github.event.pull_request.head.sha || github.sha }}" \
            -f Dockerfile.beets -t beets-engine:ci .
      - name: Verify Beets engine image
        run: |
          set -e
          python scripts/verify_beets_engine_image.py \
            --image beets-engine:ci \
            --require-version "${{ matrix.beets_version }}" \
            --require-revision "${{ github.event.pull_request.head.sha || github.sha }}" \
            --require-plugin chroma \
            --forbid-duplicate-plugin musicbrainz \
            --require-command-help mbsubmit \
            --require-command-help submit \
            --check-bpsync \
            --check-s6-supervision

  two-service-acceptance:
    name: two-service-docker-acceptance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout at exact PR head
        uses: actions/checkout@v7
        with:
          # Wave 24 final review round 3, section 25-27: the acceptance
          # script derives VCS_REF from `git rev-parse HEAD` (so the
          # image's OCI revision label is provably the commit that was
          # actually built, not asserted separately) -- for a
          # pull_request event, actions/checkout's default ref resolves
          # to the ephemeral PR *merge* commit, not the PR head SHA.
          # Checking out the real head explicitly makes `git rev-parse
          # HEAD` inside the script equal
          # github.event.pull_request.head.sha, matching what every
          # other job in this workflow passes as VCS_REF via build-arg.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: Install real Beets for disposable-library seeding
        # Wave 24 final review round 3, section 21-24: this is genuine
        # two-service acceptance -- both images built from local source
        # at this exact checkout, booted together via `docker compose`,
        # and exercised over real HTTP against the Web Manager's actual
        # production routes (which then reach the engine container only
        # over the Docker network, exactly like production) -- not an
        # image-build-only smoke test and not a direct
        # transaction_engine/Control Agent in-process call mislabeled as
        # IPC. See scripts/verify_two_service_docker_acceptance.py's
        # module docstring for the full step-by-step contract.
        run: pip install beets==2.13.1
      - name: Run two-service Docker acceptance
        run: python scripts/verify_two_service_docker_acceptance.py

  publish-ghcr:
    name: Build & Publish GHCR Image
    needs: [compose-verification, beets-engine-verification, two-service-acceptance]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata for Web Manager
        id: meta_webmanager
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/iranman/beets-web-manager
          # Wave 24 round 4 (CodeQL/provenance closure): metadata-action's
          # git context derives org.opencontainers.image.revision from the
          # GITHUB_SHA env var, which on a pull_request-triggered run is
          # the ephemeral base+head merge commit -- NOT the actual PR head
          # every other provenance check in this workflow (VCS_REF build
          # args, the two-service-acceptance job's own image inspection)
          # is built against. A custom label with the same key overrides
          # the auto-generated one, keeping this the single source of
          # truth for "what commit actually built this image."
          labels: |
            org.opencontainers.image.revision=${{ github.event.pull_request.head.sha || github.sha }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=stable,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Extract Docker metadata for Beets Engine
        id: meta_engine
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/iranman/beets-engine
          # See the identical note on the Web Manager metadata step above.
          labels: |
            org.opencontainers.image.revision=${{ github.event.pull_request.head.sha || github.sha }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=stable,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Set build date
        id: build_date
        run: echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push Beets Web Manager image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta_webmanager.outputs.tags }}
          labels: ${{ steps.meta_webmanager.outputs.labels }}
          build-args: |
            VCS_REF=${{ github.event.pull_request.head.sha || github.sha }}
            VERSION=${{ steps.meta_webmanager.outputs.version }}
            BUILD_DATE=${{ steps.build_date.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Beets Engine image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.beets
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta_engine.outputs.tags }}
          labels: ${{ steps.meta_engine.outputs.labels }}
          build-args: |
            VCS_REF=${{ github.event.pull_request.head.sha || github.sha }}
            VERSION=${{ steps.meta_engine.outputs.version }}
            BUILD_DATE=${{ steps.build_date.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
