name: docker-build

# Production build/verification only -- every job here is a real,
# required check.
#
# Architecture invariant: this repository builds and publishes exactly one
# image, ghcr.io/iranman/beets-web-manager, and it is the only container.
# Beets runs inside it (docs/adr/0006-embedded-beets.md): upstream Beets from
# PyPI at the requirements.txt pin, unmodified, with the webmanager plugin
# mounted on Beets' own web app in-process. `stock-beets-acceptance` (name
# kept for the required check) runs the embedded engine against that pinned
# Beets. tests/test_architecture_invariants.py fails if any workflow builds
# or publishes a second (Beets engine) image.

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

env:
  # The Beets version the image ships (requirements.txt), the dev/test pin
  # (requirements-dev.txt) and backend/beets_embedded.py's
  # PINNED_BEETS_VERSION; tests/test_architecture_invariants.py keeps all
  # four equal.
  BEETS_TEST_FIXTURE_VERSION: "2.14.1"

jobs:
  release-metadata:
    # VERSION and the newest CHANGELOG release heading must agree on every
    # build; on a v* tag the tag must also be exactly v<VERSION>. Gates
    # publishing so a mislabelled image can never be pushed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: VERSION / CHANGELOG / tag consistency
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            python scripts/release_metadata.py check --tag "$REF_NAME"
          else
            python scripts/release_metadata.py check
          fi

  compose-verification:
    runs-on: ubuntu-latest
    env:
      BEETS_WEB_AUTH_TOKEN: changeme
      OPENAI_API_KEY: changeme
      PLEX_TOKEN: changeme
      LIDARR_API_KEY: changeme
      AI_API_KEY: changeme
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python scripts/validate_compose_security.py
      - run: docker compose -f docker-compose.dev.yml config
      - run: docker compose -f docker-compose.full.yml config
      - run: docker compose config
      - run: docker build --pull=false --build-arg VCS_REF="${{ github.event.pull_request.head.sha || github.sha }}" -t beets-web-manager:ci .
      - name: BUILD_INFO.json matches the image's OCI labels
        # The app reports its version/revision from /app/BUILD_INFO.json;
        # it must say exactly what org.opencontainers.image.* says.
        run: |
          docker run --rm --entrypoint cat beets-web-manager:ci /app/BUILD_INFO.json > "$RUNNER_TEMP/build_info.json"
          docker image inspect --format '{{json .Config.Labels}}' beets-web-manager:ci > "$RUNNER_TEMP/labels.json"
          python - "$RUNNER_TEMP/build_info.json" "$RUNNER_TEMP/labels.json" <<'PY'
          import json, sys
          info = json.load(open(sys.argv[1])); labels = json.load(open(sys.argv[2]))
          for key in ("version", "revision", "created"):
              want = labels.get(f"org.opencontainers.image.{key}", "")
              assert info.get(key) == want, f"BUILD_INFO {key}={info.get(key)!r} != label {want!r}"
          assert info["revision"], "empty revision"
          print("BUILD_INFO.json matches labels:", info)
          PY
      - name: Supported local test image (Dockerfile.test) builds and needs no git
        # docs/DEVELOPMENT.md documents this image for running the full suite
        # locally. It has no git binary, so this proves the suite's git-free
        # audit path runs truthfully there instead of erroring.
        run: |
          docker build -f Dockerfile.test -t bwm-test:ci .
          docker run --rm -e PYTHONDONTWRITEBYTECODE=1 -v "$PWD:/src:ro" --entrypoint sh bwm-test:ci -c \
            '! command -v git && python -m unittest tests.test_arch002_caller_audit'
      - name: Hardened config survives repeated boots (#282)
        run: bash docker/acceptance/hardened_restart.sh beets-web-manager:ci "$RUNNER_TEMP/bwm-sec-bind"
      - name: Installation smoke test
        run: |
          set -e
          mkdir -p /tmp/beets-ci-config /tmp/beets-ci-music /tmp/beets-ci-downloads
          chmod -R a+rwX /tmp/beets-ci-config /tmp/beets-ci-music /tmp/beets-ci-downloads
          cp config.yaml.example /tmp/beets-ci-config/config.yaml
          docker run -d --name beets-ci \
            -p 18337:8337 \
            -e BEETS_WEB_AUTH_TOKEN=ci-smoke-test-token-not-a-real-secret \
            -e WEBCONTROL_PORT=8337 \
            -v /tmp/beets-ci-config:/config \
            -v /tmp/beets-ci-music:/music \
            -v /tmp/beets-ci-downloads:/downloads \
            beets-web-manager:ci
          # Healthy = live AND Beets' self-test passed with the shipped
          # config.yaml.example (every plugin it lists loads in the image).
          alive=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18337/api/health 2>/dev/null \
                | python3 -c 'import json, sys; sys.exit(0 if json.load(sys.stdin)["beets"]["ok"] else 1)'; then
              echo "Container is healthy after ${i}0s"
              alive=1
              break
            fi
            sleep 10
          done
          echo "--- /api/health ---"
          curl -fsS http://127.0.0.1:18337/api/health || true
          echo "--- /api/setup/status ---"
          curl -fsS -H "Authorization: Bearer ci-smoke-test-token-not-a-real-secret" \
            http://127.0.0.1:18337/api/setup/status || true
          echo "--- container logs (tail) ---"
          docker logs --tail 200 beets-ci || true
          docker stop beets-ci || true
          docker rm beets-ci || true
          if [ "$alive" -ne 1 ]; then
            echo "::error::Container never became healthy (beets.ok) within the timeout"
            exit 1
          fi

  stock-beets-acceptance:
    # Name kept for the required check. Beets inside Web Manager, against
    # upstream Beets at the requirements.txt pin: start-up self-test
    # (version, config, plugins, library, second writers), parity with a
    # real `beet web` process, threaded-request safety, the webmanager
    # plugin on Beets' own web app, and recorded-fixture autotag imports.
    name: stock-beets-acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install the image's Python dependencies (pinned Beets) and ffmpeg/fpcalc
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libchromaprint-tools
          pip install -r requirements.txt
      - name: Embedded Beets acceptance against the pinned upstream Beets
        run: >-
          python -m unittest -v
          tests.test_beets_embedded
          tests.test_beets_embedded_parity
          tests.test_beets_embedded_autotag
          tests.test_stock_beets_acceptance
          tests.test_beets214_item_paths

  production-docker-acceptance:
    name: production-docker-acceptance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout at exact PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Run production Docker acceptance (docker-compose.yml, one container)
        run: python scripts/verify_production_docker_acceptance.py

  publish-ghcr:
    name: Build & Publish GHCR Image
    needs: [release-metadata, compose-verification, stock-beets-acceptance, production-docker-acceptance]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata for Web Manager
        id: meta_webmanager
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/iranman/beets-web-manager
          # Wave 24 round 4 (CodeQL/provenance closure): metadata-action's
          # git context derives org.opencontainers.image.revision from the
          # GITHUB_SHA env var, which on a pull_request-triggered run is
          # the ephemeral base+head merge commit -- NOT the actual PR head
          # every other provenance check in this workflow (VCS_REF build
          # args, the two-service-acceptance job's own image inspection)
          # is built against. A custom label with the same key overrides
          # the auto-generated one, keeping this the single source of
          # truth for "what commit actually built this image."
          labels: |
            org.opencontainers.image.revision=${{ github.event.pull_request.head.sha || github.sha }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=stable,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Set build date
        id: build_date
        run: echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push Beets Web Manager image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta_webmanager.outputs.tags }}
          labels: ${{ steps.meta_webmanager.outputs.labels }}
          build-args: |
            VCS_REF=${{ github.event.pull_request.head.sha || github.sha }}
            VERSION=${{ steps.meta_webmanager.outputs.version }}
            BUILD_DATE=${{ steps.build_date.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    # Creates the GitHub Release for a v* tag once its image is published,
    # with the tag's CHANGELOG section as the body. Skips (does not
    # overwrite) a release that already exists, e.g. one made by hand.
    name: GitHub Release
    needs: [publish-ghcr]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # gh uses GH_TOKEN from env; keep the write token out of .git/config.
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Create release from CHANGELOG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python scripts/release_metadata.py notes --tag "$TAG" --output "$RUNNER_TEMP/release-notes.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists -- leaving it unchanged."
            exit 0
          fi
          prerelease=()
          case "$TAG" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md" "${prerelease[@]}"
