# SEC-002 / ARCH-003 Wave 24 final review round 3, section 17-24: override
# for docker-compose.full.yml used ONLY by
# scripts/verify_two_service_docker_acceptance.py. docker-compose.full.yml
# already implements the correct two-service filesystem isolation this
# review requires (the `beets` engine service gets /config, the music
# library, and the download/torrent root; `beets-web-manager` gets only its
# own /web-manager-data volume) -- this override only adds what the base
# file intentionally does not provide for a normal deployment: building
# beets-web-manager from local source at an exact commit instead of pulling
# a published GHCR tag, and a host port mapping the acceptance script can
# reach from outside the Docker network.
#
# Wave 24 final review round 3, section 25-27 (found by actually running
# this in CI -- no Docker daemon was available in the environment this was
# first authored in): `docker compose -f docker-compose.full.yml -f
# docker/acceptance/docker-compose.acceptance.yml ...` resolves every
# merged file's relative build.context against ONE project directory (the
# first/base -f file's directory -- repo root), not against each override
# file's own directory. `context: .` here means the same repo root that
# docker-compose.full.yml's own `beets` build context ("." in that file,
# also repo root) means -- a context written relative to THIS file's own
# location (docker/acceptance/, e.g. "../..") silently built against a
# directory two levels above repo root instead and failed with "open
# Dockerfile: no such file or directory".
services:
  beets-web-manager:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VCS_REF: ${VCS_REF:?set VCS_REF}
        VERSION: acceptance
    image: beets-web-manager:acceptance
    ports:
      - "127.0.0.1:${ACCEPTANCE_WEB_PORT:-18337}:8337"
    environment:
      # Hotfix v0.1.17 acceptance scenario (BUG-4/5/6): app.py clamps this
      # to a 1.0s floor (max(1.0, ...)) regardless of what is set here, so
      # this value is set to exactly that floor for clarity, not because a
      # smaller number would take effect. A 1.0s client timeout racing a
      # real move that (on this small fixture, on a fast local Docker
      # network) can complete in well under 1s is not a reliable
      # reproduction on its own -- see the deterministic
      # `_acceptance_failpoint="artist_reconcile_slow_apply"` (2s
      # server-side sleep, gated on BEETS_ACCEPTANCE_MODE=1 below) the
      # scenario passes, which is what actually guarantees the client's
      # timeout fires while the engine keeps working.
      - BEETS_ARTIST_RECONCILE_TIMEOUT_SECONDS=1
      - BEETS_LONG_OPERATION_POLL_SECONDS=0.2
      - BEETS_LONG_OPERATION_MAX_SECONDS=60

  beets:
    build:
      args:
        VCS_REF: ${VCS_REF:?set VCS_REF}
    image: beets-engine:acceptance
    environment:
      # Wave 25 Round 4: enables the single, narrowly-named
      # confirmed_import_v1 deterministic acceptance failpoint used ONLY by
      # scripts/verify_two_service_docker_acceptance.py's crash/resume
      # scenario -- see backend/beets_control_agent.py's ACCEPTANCE_MODE.
      # Never set in docker-compose.yml or docker-compose.full.yml (the
      # real deployment topologies), so this has zero effect outside this
      # disposable acceptance stack.
      - BEETS_ACCEPTANCE_MODE=1
